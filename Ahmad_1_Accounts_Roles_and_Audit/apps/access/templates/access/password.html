{% extends "base.html" %}{% load i18n %}
{% block content %}
<section class="page narrow">
  <div class="page-head"><div><h1>{% translate "Change password" %}</h1><p>{% translate "Use at least 8 characters that aren't only numbers or a common word." %}</p></div></div>
  <form method="post" class="panel pad stack" novalidate>{% csrf_token %}
    {% for f in form %}{% include "access/_field.html" %}{% endfor %}
    <button class="btn btn-red" type="submit">{% translate "Change password" %}</button>
  </form>
</section>
{% endblock %}
