<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from './three.module.js';
import { RoomEnvironment } from './RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const which = q.get('w') || 'logoA';
const W = +q.get('W') || 1200, H = +q.get('H') || 1200;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.9;

const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(-4, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd0d4, 0.5); rim.position.set(6, -2, 4); scene.add(rim);
const hemi = new THREE.HemisphereLight(0xffffff, 0xf3e6f0, 0.9); scene.add(hemi);

const crisp = q.get('crisp') === '1';
const mat = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color('#E5323B'), roughness: 0.42, metalness: 0.0,
  clearcoat: 0.55, clearcoatRoughness: 0.35, sheen: 0.0, sheenColor: new THREE.Color('#ff8a90'),
});

/* ---------- The Circular Campus logo arrow (from the logo SVG) ----------
   Logo: arc of radius 8 around (16,15), open on the right between about -14deg and +12deg,
   with a right-angle arrowhead at the upper end. Here it's an annulus segment + solid
   triangular arrowhead, extruded and bevelled into a chunky glossy 3D piece. */
function logoArrow() {
  const R = 1.0, t = 0.25;            // ring centre radius, band half-width
  const a0 = THREE.MathUtils.degToRad(20);    // start (just above the gap, where the head sits)
  const a1 = THREE.MathUtils.degToRad(-25 + 360); // end, going round counter-clockwise
  const s = new THREE.Shape();
  const N = 96;
  // outer edge a0 -> a1
  for (let i = 0; i <= N; i++) {
    const a = a0 + (a1 - a0) * i / N;
    const p = [Math.cos(a) * (R + t), Math.sin(a) * (R + t)];
    i ? s.lineTo(...p) : s.moveTo(...p);
  }
  // rounded tail cap
  const ce = [Math.cos(a1) * R, Math.sin(a1) * R];
  for (let i = 1; i < 12; i++) {
    const b = a1 + Math.PI * i / 12;
    s.lineTo(ce[0] + Math.cos(b) * t, ce[1] + Math.sin(b) * t);
  }
  // inner edge back a1 -> a0
  for (let i = N; i >= 0; i--) {
    const a = a0 + (a1 - a0) * i / N;
    s.lineTo(Math.cos(a) * (R - t), Math.sin(a) * (R - t));
  }
  // arrowhead at a0, pointing along the tangent (clockwise direction = up/right towards the gap)
  const c = [Math.cos(a0) * R, Math.sin(a0) * R];
  const tang = [Math.sin(a0), -Math.cos(a0)];      // clockwise tangent
  const nrm = [Math.cos(a0), Math.sin(a0)];
  const hw = 0.62, hl = 0.66;
  s.lineTo(c[0] - nrm[0] * hw, c[1] - nrm[1] * hw);
  s.lineTo(c[0] + tang[0] * hl, c[1] + tang[1] * hl);
  s.lineTo(c[0] + nrm[0] * hw, c[1] + nrm[1] * hw);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.13,
    bevelSize: 0.12, bevelSegments: 10, curveSegments: 48 });
  g.center(); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

/* ---------- The ribbon: a flat glossy band swept along a wave that ends in a circular arrow ---------- */
function ribbon() {
  const P = [
    [-0.4, 3.9, 0], [0.3, 4.9, 0.3], [1.4, 5.0, 0.4], [2.6, 3.9, 0.3], [4.4, 2.6, 0.1], [6.2, 2.2, 0],
    [7.7, 3.2, 0], [9.0, 3.5, 0], [10.6, 2.5, 0], [12.6, 1.9, 0], [14.6, 2.6, 0], [16.2, 3.6, 0],
    [17.8, 3.4, 0.2], [19.6, 2.9, 0.5], [21.6, 3.4, 0.7], [22.9, 4.9, 0.8], [22.9, 6.7, 0.8],
    [21.7, 8.0, 0.7], [19.9, 8.4, 0.6], [18.5, 7.7, 0.5], [17.9, 6.6, 0.4],
  ].map(p => new THREE.Vector3(...p));
  const curve = new THREE.CatmullRomCurve3(P, false, 'centripetal');
  const N = 1200, wid = 0.56, th = 0.17, M = 24;
  const pts = curve.getSpacedPoints(N);
  const headStart = Math.floor(N * 0.962);
  const pos = [], idx = [];
  // band "side" vector: perpendicular to tangent within the band; twist gives the 3D ribbon look
  const sideOf = (i) => {
    const tn = curve.getTangentAt(i / N).normalize();
    const twist = 0.5 + 0.35 * Math.sin(i / N * Math.PI * 5.0);   // 0.1..1.0 rad of lean
    const n0 = new THREE.Vector3(0, 0, 1);
    const side = new THREE.Vector3().crossVectors(tn, n0).normalize();
    side.applyAxisAngle(tn, twist);
    const normal = new THREE.Vector3().crossVectors(side, tn).normalize();
    return { side, normal };
  };
  for (let i = 0; i <= N; i++) {
    const { side, normal } = sideOf(i);
    let w = wid;
    if (i < 30) w = wid * (0.55 + 0.45 * i / 30);   // softly rounded start
    if (i >= headStart) {                             // arrowhead: flare out then taper to a point
      const k = (i - headStart) / (N - headStart);
      w = wid * 2.2 * (1 - k);
    }
    const p = pts[i];
    for (let k = 0; k < M; k++) {
      const a = 2 * Math.PI * k / M;
      pos.push(...p.clone().addScaledVector(side, Math.cos(a) * w).addScaledVector(normal, Math.sin(a) * th).toArray());
    }
  }
  for (let i = 0; i < N; i++) {
    for (let f = 0; f < M; f++) {
      const a = i * M + f, b = i * M + (f + 1) % M, c = (i + 1) * M + f, d = (i + 1) * M + (f + 1) % M;
      idx.push(a, c, b, b, c, d);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

function heroArrow(o) {
  // Ring of radius 1, band half-width t. The band runs counter-clockwise from the head (angle aH) round to the
  // tail (angle aT). The head points clockwise into the open gap, so head and tail never meet.
  const t = o.t, aH = THREE.MathUtils.degToRad(o.head), aT = THREE.MathUtils.degToRad(o.tail);
  const s = new THREE.Shape(), N = 160, R = 1;
  const P = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];
  s.moveTo(...P(aH, R + t));
  for (let i = 1; i <= N; i++) s.lineTo(...P(aH + (aT - aH) * i / N, R + t));
  // squared-off tail end
  s.lineTo(...P(aT, R - t));
  for (let i = N - 1; i >= 0; i--) s.lineTo(...P(aH + (aT - aH) * i / N, R - t));
  // curved arrowhead: barbs flare beyond the band, tip follows the ring clockwise
  const hw = t * o.headW, sweep = THREE.MathUtils.degToRad(o.headLen);
  s.lineTo(...P(aH, R - hw));
  const tipA = aH - sweep;
  // inner barb -> tip along a gentle curve, tip -> outer barb
  s.quadraticCurveTo(...P(aH - sweep * .55, R - hw * .35), ...P(tipA, R));
  s.quadraticCurveTo(...P(aH - sweep * .55, R + hw * .35), ...P(aH, R + hw));
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: o.depth, bevelEnabled: true, bevelThickness: o.bevel, bevelSize: o.bevel * .9,
    bevelSegments: 12, curveSegments: 64, steps: 1 });
  g.center(); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

let obj, camera;
if (which === 'ribbon') {
  obj = ribbon(); obj.position.set(-11.15, -5.0, 0);
  const grp = new THREE.Group(); grp.add(obj); grp.rotation.x = -0.32; scene.add(grp);
  camera = new THREE.PerspectiveCamera(22, W / H, 0.1, 200);
  camera.position.set(0, 0, 32);
} else if (which.startsWith('hero')) {
  const num = (k, d) => (q.get(k) !== null ? +q.get(k) : d);
  obj = heroArrow({ t: num('t', .2), head: num('head', 40), tail: num('tail', 315), headW: num('hw', 2.2), headLen: num('hl', 30),
                    depth: num('depth', .16), bevel: num('bevel', .07) });
  const grp = new THREE.Group(); grp.add(obj); scene.add(grp);
  grp.rotation.set(num('rx', 0) * Math.PI / 180, num('ry', 0) * Math.PI / 180, num('rz', 0) * Math.PI / 180);
  camera = new THREE.PerspectiveCamera(num('fov', 28), W / H, 0.1, 100);
  camera.position.set(0, 0, num('dist', 5.4));
} else {
  obj = logoArrow();
  const grp = new THREE.Group(); grp.add(obj); scene.add(grp);
  if (which === 'logoA') { grp.rotation.set(-0.95, 0.35, 0.25); }   // hero left: laid back, arrow pointing right
  else { grp.rotation.set(0.55, -0.75, -0.35); }                     // hero right: turned away
  camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  camera.position.set(0, 0, 6.2);
}
camera.lookAt(0, 0, 0);
renderer.render(scene, camera);
if (crisp) { mat.roughness = .24; mat.clearcoat = 1; mat.clearcoatRoughness = .06; mat.color.set('#D81E29'); scene.environmentIntensity = .7; hemi.intensity = .12; key.intensity = 1.7; renderer.toneMappingExposure = 1.0; renderer.render(scene, camera); }
window.__done = true;
</script>
</body></html>
